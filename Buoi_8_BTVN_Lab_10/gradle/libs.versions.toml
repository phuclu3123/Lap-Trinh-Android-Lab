[versions]
agp = "9.4.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.12.0"
cardview = "1.0.0"
activityKtx = "1.13.0"
constraintlayout = "2.2.2"
